services:
  postgres:
    image: postgres:16-alpine
    container_name: statuspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: statuspulse
      POSTGRES_USER: statuspulse
      POSTGRES_PASSWORD: statuspulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuspulse -d statuspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
